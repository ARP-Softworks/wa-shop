<section class="login">
  <div class="login__shell">
    <aside class="login__aside" aria-hidden="true">
      <div class="login__aside-brand">
        <img
          class="login__aside-logo"
          src="assets/logo/logo-wordmark-white.png"
          alt="WA Shop"
          width="280"
          height="120"
        />
        <p class="login__aside-eyebrow">Panel administrativo</p>
        <h2 class="login__aside-title">Panel de gestión</h2>
        <p class="login__aside-copy">
          Catálogo, pedidos, consultas y configuración en un solo lugar.
        </p>
      </div>
    </aside>

    <div class="login__panel">
      <div class="login__brand">
        <h1>Ingresar</h1>
        <p class="login__lead">Usá tu cuenta de administrador para continuar.</p>
      </div>

      <form class="login__form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="login__field">
          <label for="loginEmail">
            Email<span class="required-mark" aria-hidden="true">*</span>
          </label>
          <input
            id="loginEmail"
            type="email"
            formControlName="email"
            autocomplete="username"
            placeholder="admin@washop.uy"
          />
        </div>

        <div class="login__field">
          <label for="loginPassword">
            Contraseña<span class="required-mark" aria-hidden="true">*</span>
          </label>
          <div class="password-field">
            <input
              id="loginPassword"
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              autocomplete="current-password"
              placeholder="Tu contraseña"
            />
            <button
              type="button"
              class="password-toggle"
              (click)="showPassword = !showPassword"
              [attr.aria-pressed]="showPassword"
              [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            >
              {{ showPassword ? 'Ocultar' : 'Mostrar' }}
            </button>
          </div>
        </div>

        @if (errorMessage) {
          <p class="login__error" role="alert">{{ errorMessage }}</p>
        }

        <button type="submit" class="btn login__submit" [disabled]="submitting">
          {{ submitting ? 'Ingresando…' : 'Ingresar' }}
        </button>
      </form>

      <a class="login__back" routerLink="/">← Volver al sitio</a>
    </div>
  </div>
</section>
