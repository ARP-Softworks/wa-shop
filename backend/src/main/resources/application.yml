spring:
  application:
    name: wa-shop
  profiles:
    # No default to "local": that profile loads demo seed (db/dev). Set explicitly:
    # SPRING_PROFILES_ACTIVE=local | production | test
    active: ${SPRING_PROFILES_ACTIVE:}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/washop}
    username: ${SPRING_DATASOURCE_USERNAME:washop}
    password: ${SPRING_DATASOURCE_PASSWORD:washop}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  web:
    resources:
      static-locations: classpath:/static/

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: ${APP_SESSION_TIMEOUT:8h}
      cookie:
        name: ${APP_COOKIE_SESSION_NAME:WASESSION}
        http-only: true
        secure: ${APP_COOKIE_SECURE:false}
        same-site: ${APP_COOKIE_SAME_SITE:Lax}
    multipart:
      max-file-size: ${MEDIA_MAX_FILE_SIZE:5242880}B
      max-request-size: ${MEDIA_MAX_REQUEST_SIZE:6291456}B

management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    mail:
      # Mail is an optional, lazily-validated feature (see OrderEmailService) — an
      # unconfigured/unreachable SMTP server must not flip the whole app's health to DOWN.
      enabled: false

app:
  session:
    timeout-seconds: ${APP_SESSION_TIMEOUT_SECONDS:28800}
  cookie:
    secure: ${APP_COOKIE_SECURE:false}
    same-site: ${APP_COOKIE_SAME_SITE:Lax}
    session-name: ${APP_COOKIE_SESSION_NAME:WASESSION}
  login:
    max-failed-attempts: ${APP_LOGIN_MAX_FAILED_ATTEMPTS:5}
    lock-duration-seconds: ${APP_LOGIN_LOCK_DURATION_SECONDS:900}
  admin-bootstrap:
    email: ${APP_ADMIN_BOOTSTRAP_EMAIL:}
    password: ${APP_ADMIN_BOOTSTRAP_PASSWORD:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  whatsapp:
    phone: ${APP_WHATSAPP_PHONE:}
  media:
    provider: ${MEDIA_PROVIDER:${APP_MEDIA_PROVIDER:local}}
    max-file-size: ${MEDIA_MAX_FILE_SIZE:5242880}
    allowed-types: ${MEDIA_ALLOWED_TYPES:image/jpeg,image/png,image/webp}
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
    local:
      base-dir: ${MEDIA_LOCAL_DIR:./data/media}
  payment:
    provider: ${PAYMENT_PROVIDER:mercadopago}
    mercado-pago:
      access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
      public-key: ${MERCADOPAGO_PUBLIC_KEY:}
      webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}
  order:
    pending-expiry-minutes: ${ORDER_PENDING_EXPIRY_MINUTES:45}
    checkout-ip-max-per-window: ${ORDER_CHECKOUT_IP_MAX_PER_WINDOW:8}
    checkout-phone-max-per-window: ${ORDER_CHECKOUT_PHONE_MAX_PER_WINDOW:4}
    checkout-window-seconds: ${ORDER_CHECKOUT_WINDOW_SECONDS:900}
  mail:
    from: ${MAIL_FROM:WA Shop <no-reply@washop.uy>}
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
  public-site-url: ${PUBLIC_SITE_URL:${APP_PUBLIC_BASE_URL:http://localhost:8080}}
  seo:
    google-site-verification: ${GOOGLE_SITE_VERIFICATION:}
    bing-site-verification: ${BING_SITE_VERIFICATION:}
  analytics:
    google-analytics-id: ${GOOGLE_ANALYTICS_ID:}
    google-tag-manager-id: ${GOOGLE_TAG_MANAGER_ID:}

logging:
  level:
    root: INFO
    uy.washop: INFO
